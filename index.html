<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="referrer" content="no-referrer">
<!-- connect-src 'none' khiến trang KHÔNG THỂ gửi request đi đâu, ở mức trình duyệt
     cưỡng chế. Người dùng tự kiểm chứng được bằng DevTools thay vì phải tin lời hứa.
     Đặt ở <meta> nên chỉ áp cho document, không áp cho sw.js (service worker cần
     fetch để cache offline). -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; manifest-src 'self'; worker-src 'self'; connect-src 'none'; base-uri 'none'; form-action 'none'">
<title>2FA Offline — Tạo mã xác thực tại máy</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M12 2 4 5.5v6c0 5 3.4 9.4 8 10.5 4.6-1.1 8-5.5 8-10.5v-6L12 2z"/>
    </svg>
    <div>
      <h1>2FA Offline</h1>
      <p class="brand-sub" data-i18n="brandSub"></p>
    </div>
  </div>
  <div class="topbar-actions">
    <span class="pill pill-ok" id="netBadge" data-i18n="netBadge"
          data-i18n-attr="title:netBadgeTitle"></span>
    <button class="icon-btn" id="btnLock" type="button"
            data-i18n-attr="title:lockNow;aria-label:lockNow" hidden>🔒</button>
    <button class="icon-btn" id="btnGuide" type="button" aria-expanded="false" aria-controls="guide"
            data-i18n-attr="title:guideBtn;aria-label:guideBtn">?</button>
    <button class="icon-btn" id="btnTheme" type="button"
            data-i18n-attr="title:themeBtn;aria-label:themeBtn">◐</button>
    <button class="icon-btn" id="btnSettings" type="button"
            data-i18n-attr="title:settingsBtn;aria-label:settingsBtn">⚙</button>
    <button class="icon-btn icon-btn-text" id="btnLang" type="button"
            data-i18n="langSwitchLabel" data-i18n-attr="title:langSwitchTitle;aria-label:langSwitchTitle"></button>
  </div>
</header>

<main>
  <!-- ============ Ô nhập nhanh ============ -->
  <section class="card panel">
    <div class="panel-head">
      <h2 data-i18n="inputHeading"></h2>
      <button class="link-btn" id="btnFormatHelp" type="button" data-i18n="formatHelpBtn"></button>
    </div>

    <textarea id="input" spellcheck="false" autocapitalize="off" autocorrect="off"
      data-i18n-attr="placeholder:inputPlaceholder"></textarea>

    <div id="formatHelp" class="help" hidden>
      <ul>
        <li data-i18n-html="fmt1"></li>
        <li data-i18n-html="fmt2"></li>
        <li data-i18n-html="fmt3"></li>
        <li data-i18n-html="fmt4"></li>
      </ul>
    </div>

    <div class="row-actions">
      <button class="btn btn-primary" id="btnGenerate" type="button" data-i18n="btnGenerate"></button>
      <button class="btn" id="btnSaveAll" type="button" data-i18n="btnSaveAll"></button>
      <button class="btn btn-ghost" id="btnClearInput" type="button" data-i18n="btnClearInput"></button>
      <label class="inline-field"><span data-i18n="saveGroupLabel"></span>
        <input type="text" id="saveGroup" list="groupList" autocomplete="off" maxlength="40"
               data-i18n-attr="placeholder:saveGroupPlaceholder">
      </label>
    </div>

    <datalist id="groupList"></datalist>

    <div id="parseErrors" class="errors" hidden></div>
    <div id="quickList" class="grid"></div>
  </section>

  <!-- ============ Danh sách đã lưu ============ -->
  <section class="card panel">
    <div class="panel-head">
      <h2><span data-i18n="vaultHeading"></span> <span class="count" id="vaultCount">0</span></h2>
      <div class="panel-tools">
        <input type="search" id="search" autocomplete="off"
               data-i18n-attr="placeholder:searchPlaceholder">
        <button class="btn btn-sm" id="btnSelectMode" type="button"></button>
        <button class="btn btn-sm" id="btnExportJson" type="button"
                data-i18n="btnExportJson" data-i18n-attr="title:exportJsonTitle"></button>
        <button class="btn btn-sm" id="btnExportEnc" type="button"
                data-i18n="btnExportEnc" data-i18n-attr="title:exportEncTitle"></button>
        <button class="btn btn-sm" id="btnExportTxt" type="button"
                data-i18n="btnExportTxt" data-i18n-attr="title:exportTxtTitle"></button>
        <button class="btn btn-sm" id="btnImport" type="button" data-i18n="btnImport"></button>
        <input type="file" id="fileImport" accept=".json,.txt,.csv,text/plain,application/json" hidden>
      </div>
    </div>

    <div id="groupBar" class="group-bar" hidden></div>

    <div id="groupActions" class="group-actions" hidden>
      <span><span data-i18n="groupWord"></span> <b id="gaName"></b></span>
      <button class="btn btn-sm" id="btnGroupRename" type="button" data-i18n="btnGroupRename"></button>
      <button class="btn btn-sm btn-danger" id="btnGroupDelete" type="button" data-i18n="btnGroupDelete"></button>
    </div>

    <div id="bulkBar" class="bulk-bar" hidden>
      <span class="bulk-count"><span data-i18n="bulkSelected"></span> <b id="bulkCount">0</b></span>
      <input type="text" id="bulkGroup" list="groupList" maxlength="40" autocomplete="off"
             data-i18n-attr="placeholder:bulkGroupPlaceholder">
      <button class="btn btn-sm btn-primary" id="btnBulkAssign" type="button" data-i18n="btnBulkAssign"></button>
      <button class="btn btn-sm" id="btnBulkUngroup" type="button" data-i18n="btnBulkUngroup"></button>
      <button class="btn btn-sm" id="btnBulkSelectAll" type="button" data-i18n="btnBulkSelectAll"></button>
      <button class="btn btn-sm" id="btnBulkClear" type="button" data-i18n="btnBulkClear"></button>
      <button class="btn btn-sm btn-danger" id="btnBulkDelete" type="button" data-i18n="btnBulkDelete"></button>
    </div>

    <div id="vaultList" class="grid"></div>
    <p class="empty" id="vaultEmpty"></p>
  </section>
</main>

<footer class="foot">
  <p id="footSecurity"></p>
  <p class="crypto-note" id="cryptoNote"></p>

  <!-- Tự ẩn nếu chưa có icons/donate-qr.png. Trình xử lý gắn bằng JS chứ không
       dùng onerror inline, vì CSP script-src 'self' chặn inline handler. -->
  <section class="support" id="support" hidden>
    <h2 data-i18n="supportHeading"></h2>
    <p data-i18n="supportText"></p>
    <img id="donateQr" src="icons/donate-qr.png" data-i18n-attr="alt:qrAlt">
    <p class="support-note" data-i18n="supportNote"></p>
  </section>

  <p class="credit" data-i18n-html="credit"></p>
</footer>

<!-- ============ Dialog: hướng dẫn sử dụng ============ -->
<dialog id="guideDialog" class="dlg modal">
  <div class="modal-head">
    <h3 data-i18n="guideHeading"></h3>
    <button class="modal-close" id="btnGuideClose" type="button"
            data-i18n-attr="title:btnClose;aria-label:btnClose">✕</button>
  </div>

  <div class="modal-body">
    <ol class="guide-steps">
      <li><span class="step-num">1</span><span data-i18n-html="guideStep1"></span></li>
      <li><span class="step-num">2</span><span data-i18n-html="guideStep2"></span></li>
      <li><span class="step-num">3</span><span data-i18n-html="guideStep3"></span></li>
      <li><span class="step-num">4</span><span data-i18n-html="guideStep4"></span></li>
      <li><span class="step-num">5</span><span data-i18n-html="guideStep5"></span></li>
    </ol>

    <h4 class="guide-sec-title" data-i18n="guideExportTitle"></h4>
    <ul class="guide-notes">
      <li data-i18n-html="guideExportJson"></li>
      <li data-i18n-html="guideExportEnc"></li>
      <li data-i18n-html="guideExportTxt"></li>
    </ul>
    <p class="guide-aside" data-i18n-html="guideExportWhy"></p>
    <p class="guide-tip" data-i18n-html="guideExportAdvice"></p>

    <h4 class="guide-sec-title" data-i18n="guideNoteTitle"></h4>
    <ul class="guide-notes">
      <li data-i18n-html="guideNote1"></li>
      <li data-i18n-html="guideNote2"></li>
    </ul>

    <h4 class="guide-risk-title" data-i18n="guideRiskTitle"></h4>
    <ul class="guide-risks">
      <li data-i18n-html="guideRisk1"></li>
      <li data-i18n-html="guideRisk2"></li>
      <li data-i18n-html="guideRisk3"></li>
      <li data-i18n-html="guideRisk4"></li>
      <li data-i18n-html="guideRisk5"></li>
      <li data-i18n-html="guideRisk6"></li>
    </ul>
  </div>

  <div class="modal-foot">
    <button class="btn btn-primary" id="btnGuideDone" type="button" data-i18n="guideClose"></button>
  </div>
</dialog>

<!-- ============ Màn khoá ============ -->
<div id="lockScreen" class="lock" hidden>
  <div class="lock-box">
    <svg class="lock-icon" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M12 2 4 5.5v6c0 5 3.4 9.4 8 10.5 4.6-1.1 8-5.5 8-10.5v-6L12 2z"/>
    </svg>
    <h2 data-i18n="lockHeading"></h2>
    <p class="lock-sub" data-i18n="lockSub"></p>
    <form id="lockForm" autocomplete="off">
      <input type="password" id="lockPw" autocomplete="current-password"
             data-i18n-attr="placeholder:lockPwPlaceholder">
      <p class="dlg-error" id="lockErr" hidden></p>
      <button class="btn btn-primary" id="btnUnlock" type="submit" data-i18n="btnUnlock"></button>
    </form>
    <button class="link-btn" id="btnForgot" type="button" data-i18n="btnForgot"></button>
    <button class="link-btn link-danger" id="btnLockWipe" type="button" data-i18n="btnLockWipe"></button>
  </div>
</div>

<!-- ============ Dialog: sửa tài khoản ============ -->
<dialog id="editDialog" class="dlg">
  <form method="dialog" id="editForm">
    <h3 id="editTitle" data-i18n="editTitle"></h3>
    <label><span data-i18n="fLabel"></span>
      <input type="text" id="fLabel" autocomplete="off" required>
    </label>
    <label><span data-i18n="fPassword"></span> <span class="muted" data-i18n="optional"></span>
      <input type="text" id="fPassword" autocomplete="off">
    </label>
    <label><span data-i18n="fSecret"></span>
      <input type="text" id="fSecret" autocomplete="off" spellcheck="false" required>
    </label>
    <label><span data-i18n="fGroup"></span> <span class="muted" data-i18n="groupHint"></span>
      <input type="text" id="fGroup" list="groupList" autocomplete="off" maxlength="40">
    </label>
    <label><span data-i18n="fNote"></span> <span class="muted" data-i18n="optional"></span>
      <input type="text" id="fNote" autocomplete="off">
    </label>
    <div class="field-row">
      <label><span data-i18n="fDigits"></span>
        <select id="fDigits"><option>6</option><option>7</option><option>8</option></select>
      </label>
      <label><span data-i18n="fPeriod"></span>
        <input type="number" id="fPeriod" min="10" max="300" step="1">
      </label>
      <label><span data-i18n="fAlgorithm"></span>
        <select id="fAlgorithm">
          <option value="SHA-1">SHA-1</option>
          <option value="SHA-256">SHA-256</option>
          <option value="SHA-512">SHA-512</option>
        </select>
      </label>
    </div>
    <p class="dlg-error" id="editError" hidden></p>
    <div class="dlg-actions">
      <button class="btn btn-ghost" value="cancel" type="submit" data-i18n="btnCancel"></button>
      <button class="btn btn-primary" id="btnEditSave" value="save" type="submit" data-i18n="btnSave"></button>
    </div>
  </form>
</dialog>

<!-- ============ Dialog: đặt mật khẩu chính ============ -->
<dialog id="pwDialog" class="dlg">
  <form id="pwForm" autocomplete="off">
    <h3 id="pwTitle"></h3>
    <p class="muted small" id="pwIntro"></p>
    <label><span data-i18n="pwNew"></span>
      <input type="password" id="pwNew" autocomplete="new-password">
    </label>
    <label><span data-i18n="pwConfirm"></span>
      <input type="password" id="pwConfirm" autocomplete="new-password">
    </label>
    <p class="warn-box" id="pwWarn" data-i18n="pwWarn"></p>
    <p class="dlg-error" id="pwError" hidden></p>
    <div class="dlg-actions">
      <button class="btn btn-ghost" type="button" id="btnPwCancel" data-i18n="btnCancel"></button>
      <button class="btn btn-primary" id="btnPwOk" type="submit" data-i18n="btnConfirm"></button>
    </div>
  </form>
</dialog>

<!-- ============ Dialog: mở file backup mã hoá ============ -->
<dialog id="backupPwDialog" class="dlg">
  <form id="bpForm" autocomplete="off">
    <h3 data-i18n="bpHeading"></h3>
    <p class="muted small" data-i18n="bpIntro"></p>
    <label><span data-i18n="bpPwLabel"></span>
      <input type="password" id="bpPw" autocomplete="off">
    </label>
    <p class="dlg-error" id="bpError" hidden></p>
    <div class="dlg-actions">
      <button class="btn btn-ghost" type="button" id="btnBpCancel" data-i18n="btnCancel"></button>
      <button class="btn btn-primary" id="btnBpOk" type="submit" data-i18n="btnDecrypt"></button>
    </div>
  </form>
</dialog>

<!-- ============ Dialog: cài đặt ============ -->
<dialog id="settingsDialog" class="dlg">
  <form method="dialog">
    <h3 data-i18n="settingsHeading"></h3>

    <label class="check">
      <input type="checkbox" id="sReveal"> <span data-i18n="sReveal"></span>
    </label>
    <label class="check">
      <input type="checkbox" id="sShowPw"> <span data-i18n="sShowPw"></span>
    </label>

    <label><span data-i18n="langLabel"></span>
      <select id="sLang">
        <option value="vi">Tiếng Việt</option>
        <option value="en">English</option>
      </select>
    </label>

    <label><span data-i18n="sOffset"></span>
      <input type="number" id="sOffset" step="1" value="0">
    </label>
    <p class="muted small"><span data-i18n="offsetHint"></span> <span id="clockNow">—</span></p>

    <div class="sec-block">
      <h4 data-i18n="mkHeading"></h4>
      <p class="muted small" id="encStatus">—</p>
      <div class="row-actions">
        <button class="btn btn-sm" id="btnEncEnable" type="button" data-i18n="btnEncEnable"></button>
        <button class="btn btn-sm" id="btnEncChange" type="button" data-i18n="btnEncChange"></button>
        <button class="btn btn-sm btn-danger" id="btnEncDisable" type="button" data-i18n="btnEncDisable"></button>
      </div>
      <label><span data-i18n="autoLockLabel"></span>
        <select id="sAutoLock">
          <option value="0"></option>
          <option value="1"></option>
          <option value="5"></option>
          <option value="15"></option>
          <option value="60"></option>
        </select>
      </label>
    </div>

    <p class="muted small" id="persistStatus"></p>

    <div class="danger-zone">
      <button class="btn btn-danger btn-sm" id="btnWipe" type="button" data-i18n="btnWipe"></button>
    </div>

    <div class="dlg-actions">
      <button class="btn btn-primary" value="close" type="submit" data-i18n="btnClose"></button>
    </div>
  </form>
</dialog>

<div id="toast" class="toast" role="status" aria-live="polite"></div>
<div id="busy" class="busy" hidden><div class="busy-box"><span class="spinner"></span><span id="busyText"></span></div></div>

<script src="js/i18n.js"></script>
<script src="js/base32.js"></script>
<script src="js/sha.js"></script>
<script src="js/totp.js"></script>
<script src="js/parser.js"></script>
<script src="js/crypto.js"></script>
<script src="js/storage.js"></script>
<script src="js/app.js"></script>
</body>
</html>
